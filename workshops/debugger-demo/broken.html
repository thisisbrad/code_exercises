<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buggy To-Do App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="calculator-container">
      <div class="calculator-top"></div>
      <div class="calculator-body">
        <h1>To-Do List</h1>
        <div class="calculator-screen">
          <input type="text" id="taskInput" placeholder="Enter a task" />
        </div>
        <div class="calculator-controls">
          <button>Add Task</button>
        </div>
        <div class="task-display">
          <ul id="taskList"></ul>
        </div>
      </div>
      <div class="calculator-feet">
        <div class="foot"></div>
        <div class="foot"></div>
        <div class="foot"></div>
        <div class="foot"></div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const inputField = document.getElementById("userInput");
        const submitButton = document.getElementById("submitBtn");
        const outputDiv = document.getElementById("output");

        let tasks = [
          { text: "walk the dog", completed: true },
          { text: "make dinner", completed: false },
          { text: "pay the bills", completed: true },
          { text: "do your taxes", completed: false },
        ];

        function refreshList() {
          let list = document.getElementById("taskList");

          console.log("🕵️‍♂️ tasks:", tasks);
          tasks.forEach((task) => {
            // creates the whole li element everything attaches too
            const listItem = document.createElement("li");
            // creates the check box and checks it or not
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;
            // creates the text for the todo tasks
            const span = document.createElement("span");
            span.textContent = task.text;

            if (!task.completed) {
              span.classList.add("completed");
            }

            function setupEventListeners() {
              checkbox.addEventListener("change", function () {
                toggleTodo(task);
              });
            }

            setupEventListeners();

            listItem.appendChild(checkbox);
            listItem.appendChild(span);
            list.appendChild(listItem);
          });
        }
        refreshList();

        function toggleTodo(index) {
          const updatedTodo = Object.assign({}, tasks[index]);
          updatedTodo.completed = !updatedTodo.completed;
          tasks[index] = updatedTodo;
          refreshList();
        }

        submitButton.addEventListener("click", function () {
          let taskInput = inputField.text;

          if (!taskInput) {
            console.log("Task input is empty!");
            return;
          }

          tasks.push(taskInput);
          refreshList();
        });
      });
    </script>
  </body>
</html>
