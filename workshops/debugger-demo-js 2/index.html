<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buggy ToDo App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .todo-item {
        display: flex;
        align-items: center;
        margin: 8px 0;
        padding: 8px;
        border: 1px solid #ddd;
      }
      .completed {
        text-decoration: line-through;
        color: #888;
      }
      button {
        margin-left: 8px;
      }
      .error {
        color: red;
        font-size: 14px;
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <h1>Buggy ToDo App</h1>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." />
      <button type="submit">Add Task</button>
    </form>
    <div id="error-container" class="error"></div>

    <div>
      <h2>Tasks (<span id="task-count">0</span>)</h2>
      <ul id="todo-list"></ul>
    </div>

    <button id="clear-completed">Clear Completed</button>
    <button id="save-tasks">Save Tasks</button>
    <button id="load-tasks">Load Tasks</button>

    <script>
      // BUG 1: Scope Issue - Using var instead of let in loops
      const todoForm = document.getElementById("todo-form");
      const todoInput = document.getElementById("todo-input");
      const todoList = document.getElementById("todo-list");
      const taskCountElement = document.getElementById("task-count");
      const errorContainer = document.getElementById("error-container");
      const clearCompletedBtn = document.getElementById("clear-completed");
      const saveTasksBtn = document.getElementById("save-tasks");
      const loadTasksBtn = document.getElementById("load-tasks");

      let todos = [];

      // Initial setup
      function initialize() {
        updateTaskCount();

        // BUG 2: Event Handler Memory Leak - Event listeners will be added multiple times
        todoForm.addEventListener("submit", addTodo);
        clearCompletedBtn.addEventListener("click", clearCompleted);
        saveTasksBtn.addEventListener("click", saveTodos);
        loadTasksBtn.addEventListener("click", loadTodos);

        // Call initialize again after a short delay (simulating component remount)
        // setTimeout(initialize, 5000);
      }

      function addTodo(event) {
        event.preventDefault();
        const text = todoInput.value.trim();

        // BUG 3: Type Coercion Issue - Using == instead of ===
        if (text == 0) {
          showError("Task cannot be empty!");
          return;
        }

        const newTodo = {
          id: Date.now(),
          text: text,
          completed: false,
          created: new Date(),
        };

        todos.push(newTodo);
        todoInput.value = "";
        renderTodos();
        updateTaskCount();
      }

      function renderTodos() {
        todoList.innerHTML = "";

        // BUG 1: Scope Issue - Using var in loop
        for (let i = 0; i < todos.length; i++) {
          const todo = todos[i];
          const li = document.createElement("li");
          li.className = "todo-item";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;

          const span = document.createElement("span");
          span.textContent = todo.text;
          if (todo.completed) {
            span.classList.add("completed");
          }

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";

          // BUG 1 continues: This function uses the loop variable i
          function setupEventListeners() {
            checkbox.addEventListener("change", function () {
              toggleTodo(i); // Bug: i will be todos.length when this executes
            });

            deleteBtn.addEventListener("click", function () {
              deleteTodo(todo.id);
            });
          }

          setupEventListeners();

          li.appendChild(checkbox);
          li.appendChild(span);
          li.appendChild(deleteBtn);
          todoList.appendChild(li);
        }
      }

      function toggleTodo(index) {
        // BUG 4: Reference/Deep Copy Issue
        const updatedTodo = Object.assign({}, todos[index]);
        updatedTodo.completed = !updatedTodo.completed;
        console.log(updatedTodo);

        // Only replace the specific todo
        todos[index] = updatedTodo;
        renderTodos();
      }

      function deleteTodo(id) {
        todos = todos.filter((todo) => todo.id !== id);
        renderTodos();
        updateTaskCount();
      }

      function updateTaskCount() {
        taskCountElement.textContent = todos.length;
      }

      function clearCompleted() {
        todos = todos.filter((todo) => !todo.completed);
        renderTodos();
        updateTaskCount();
      }

      // BUG 5: Asynchronous Code Issue
      function saveTodos() {
        // Simulate API call to save todos
        const savePromise = new Promise((resolve) => {
          setTimeout(() => {
            localStorage.setItem("todos", JSON.stringify(todos));
            resolve("Todos saved successfully");
          }, 1000);
        });

        // Bug: No proper promise handling
        const message = savePromise.then((msg) => {
          return msg;
        });

        // This will execute before the promise resolves
        showError(message); // Will show [object Promise] instead of the message
      }

      function loadTodos() {
        try {
          // BUG 6: Not checking if data exists before parsing
          const storedTodos = JSON.parse(localStorage.getItem("todos"));
          todos = storedTodos;
          renderTodos();
          updateTaskCount();
        } catch (error) {
          showError("Failed to load tasks: " + error.message);
        }
      }

      function showError(message) {
        errorContainer.textContent = message;
        setTimeout(() => {
          errorContainer.textContent = "";
        }, 3000);
      }

      // Initialize the application
      initialize();
    </script>
  </body>
</html>
