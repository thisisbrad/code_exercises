<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Braun Calculator To-Do</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="todo-app">
      <div class="todo-screen" id="todo-screen">Enter Task</div>

      <ul class="todo-list" id="todo-list">
        <!-- Tasks will be added here -->
      </ul>

      <div class="todo-buttons">
        <button class="todo-key">7</button>
        <button class="todo-key">8</button>
        <button class="todo-key">9</button>
        <button class="todo-delete">⌫</button>

        <button class="todo-key">4</button>
        <button class="todo-key">5</button>
        <button class="todo-key">6</button>
        <button class="todo-key">-</button>

        <button class="todo-key">1</button>
        <button class="todo-key">2</button>
        <button class="todo-key">3</button>
        <button class="todo-key">+</button>

        <button class="todo-key">0</button>
        <button class="todo-key">.</button>
        <button class="todo-key">C</button>
        <button class="todo-enter">✔</button>
      </div>
    </div>

    <script>
      const screen = document.getElementById("todo-screen");
      const list = document.getElementById("todo-list");
      const buttons = document.querySelectorAll(".todo-key");
      const enterButton = document.querySelector(".todo-enter");
      const deleteButton = document.querySelector(".todo-delete");

      let currentInput = "";

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          currentInput += button.textContent;
          screen.textContent = currentInput;
        });
      });

      deleteButton.addEventListener("click", () => {
        currentInput = currentInput.slice(0, -1);
        screen.textContent = currentInput || "Enter Task";
      });

      enterButton.addEventListener("click", () => {
        if (!currentInput.trim()) return;

        const li = document.createElement("li");
        li.className = "todo-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";

        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = currentInput;

        checkbox.addEventListener("change", () => {
          span.classList.toggle("done", checkbox.checked);
        });

        const delBtn = document.createElement("button");
        delBtn.className = "todo-delete";
        delBtn.innerHTML = "&times;";
        delBtn.addEventListener("click", () => li.remove());

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        list.appendChild(li);

        currentInput = "";
        screen.textContent = "Enter Task";
      });
    </script>
  </body>
</html>
